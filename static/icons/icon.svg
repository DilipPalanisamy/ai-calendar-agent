<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="appGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Card -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#appGradient)" filter="url(#glow)" />
  
  <!-- Calendar Container -->
  <rect x="116" y="128" width="280" height="264" rx="28" fill="#0f172a" fill-opacity="0.92" stroke="rgba(255,255,255,0.2)" stroke-width="4" />
  
  <!-- Top Calendar Header Bar -->
  <path d="M 116 156 Q 116 128 144 128 L 368 128 Q 396 128 396 156 L 396 190 L 116 190 Z" fill="#ffffff" />
  
  <!-- Calendar Rings / Hooks -->
  <rect x="176" y="104" width="24" height="48" rx="12" fill="#e2e8f0" />
  <rect x="312" y="104" width="24" height="48" rx="12" fill="#e2e8f0" />
  
  <!-- Checkmark in Calendar -->
  <path d="M 188 280 L 236 328 L 332 232" fill="none" stroke="#6366f1" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Sparkles / AI Star in Corner -->
  <path d="M 380 96 L 392 128 L 424 140 L 392 152 L 380 184 L 368 152 L 336 140 L 368 128 Z" fill="#fbbf24" />
  <path d="M 130 380 L 138 400 L 158 408 L 138 416 L 130 436 L 122 416 L 102 408 L 122 400 Z" fill="#38bdf8" />
